<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMA array next UI</title>
<style>
/* Layout idea: a design review page. Summary first (4 views), then wireframes, then the flow, then measured numbers and the open choices. */
:root { --bg:#f5f6f8; --panel:#ffffff; --ink:#14181f; --muted:#5d6675; --line:#d4d9e1; --accent:#1b6ef3; --good:#1f8a4c; --warn:#b36b00; --bad:#c0392b; --wire:#8a94a6; --fill:#e8ecf3;
  --fs-0: 12px; --fs-1: 14px; --fs-2: 18px; --fs-3: 24px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e1116; --panel:#171b22; --ink:#e6e9ef; --muted:#96a0b0; --line:#2a303b; --accent:#5b9bff; --good:#4cc27f; --warn:#e0a23a; --bad:#ef6a5a; --wire:#6d7788; --fill:#222833; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#0e1116; --panel:#171b22; --ink:#e6e9ef; --muted:#96a0b0; --line:#2a303b; --accent:#5b9bff; --good:#4cc27f; --warn:#e0a23a; --bad:#ef6a5a; --wire:#6d7788; --fill:#222833; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs-1)/1.5 var(--font); }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 28px; }
h1 { font-size: var(--fs-3); margin: 0; text-wrap: balance; }
h2 { font-size: var(--fs-2); margin: 0 0 10px; text-wrap: balance; }
p { margin: 0 0 8px; max-width: 70ch; }
.muted { color: var(--muted); }
section { display: grid; gap: 12px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.wide { grid-column: 1 / -1; }
.wide svg { max-width: 760px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
figure { margin: 0; display: grid; gap: 6px; }
figcaption { font-size: var(--fs-0); color: var(--muted); }
svg { width: 100%; height: auto; display: block; }
svg text { fill: currentColor; font: var(--fs-0) var(--mono); }
svg .box { fill: var(--fill); stroke: var(--wire); stroke-width: 1; }
svg .hot { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); }
svg .ln { stroke: var(--wire); fill: none; stroke-width: 1.2; }
svg .arrow { stroke: currentColor; fill: none; stroke-width: 1.4; }
svg .rec { fill: var(--bad); }
img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; display: block; }
.shots { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.shots figure { flex: 1 1 360px; }
.shots figure.phone { flex: 0 1 220px; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-1); }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { overflow-x: auto; }
code { font-family: var(--mono); font-size: var(--fs-0); }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: var(--fs-0); color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>BMA array next UI</h1>
    <p class="muted">Review of the prototype in <code>bench-kit/bma-audiod/ui-next</code> on branch <code>ui-next</code>. Synthetic data only. Nothing here is deployed.</p>
  </header>

  <section>
    <h2>Five tabs and thirty panels become four views</h2>
    <div class="card"><figure>
      <svg viewBox="0 0 900 250" role="img" aria-label="The five current tabs map onto four views: Overview, Beams and the live spectrum merge into Live; Review stays; Detections absorbs Overview tables; System absorbs beam analytics.">
        <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
        <g><rect class="box" x="10" y="14" width="150" height="38" rx="6"/><text x="22" y="37">Overview (6 panels)</text>
           <rect class="box" x="10" y="64" width="150" height="38" rx="6"/><text x="22" y="87">Detections (8)</text>
           <rect class="box" x="10" y="114" width="150" height="38" rx="6"/><text x="22" y="137">Beams (7)</text>
           <rect class="box" x="10" y="164" width="150" height="38" rx="6"/><text x="22" y="187">System (7)</text>
           <rect class="box" x="10" y="212" width="150" height="30" rx="6"/><text x="22" y="231">Review (2)</text></g>
        <g><rect class="hot" x="560" y="14" width="330" height="50" rx="6"/><text x="574" y="36">Live (3)</text><text x="574" y="53" class="muted">waterfall, beam chips + meters, listen, ticker</text>
           <rect class="hot" x="560" y="74" width="330" height="50" rx="6"/><text x="574" y="96">Review (2)</text><text x="574" y="113">queue, player, spectrogram, keys</text>
           <rect class="hot" x="560" y="134" width="330" height="50" rx="6"/><text x="574" y="156">Detections (3)</text><text x="574" y="173">table, density strip, species chips</text>
           <rect class="hot" x="560" y="194" width="330" height="48" rx="6"/><text x="574" y="216">System (4)</text><text x="574" y="233">health, plugins, array quality, advanced</text></g>
        <path class="arrow" d="M160 33 C 360 33, 380 39, 556 39" marker-end="url(#a)"/>
        <path class="arrow" d="M160 133 C 360 133, 380 50, 556 50" marker-end="url(#a)"/>
        <path class="arrow" d="M160 185 C 360 185, 380 60, 556 60" marker-end="url(#a)"/>
        <path class="arrow" d="M160 227 C 360 227, 380 100, 556 100" marker-end="url(#a)"/>
        <path class="arrow" d="M160 45 C 330 60, 380 150, 556 150" marker-end="url(#a)"/>
        <path class="arrow" d="M160 84 C 360 84, 380 160, 556 160" marker-end="url(#a)"/>
        <path class="arrow" d="M160 140 C 330 170, 380 215, 556 215" marker-end="url(#a)"/>
        <path class="arrow" d="M160 195 C 300 205, 380 225, 556 225" marker-end="url(#a)"/>
      </svg>
      <figcaption>Live takes the live beam views from Overview, Beams and System. Detections takes the recent and top-species tables. System takes the beam analytics as a drill-down.</figcaption>
    </figure></div>
  </section>

  <section>
    <h2>Wireframes</h2>
    <div class="grid">
      <div class="card wide"><figure>
        <svg viewBox="0 0 560 330" role="img" aria-label="Desktop Live view: header with state, strip and listen indicator; a large waterfall with nine beam strips below; a side column with inspector, listen button and detection ticker.">
          <rect class="box" x="4" y="4" width="552" height="26" rx="4"/><text x="14" y="21">BMA array  [live]  loss 0.22%  detections 41  clips 18  [REC listening]</text>
          <rect class="box" x="4" y="36" width="552" height="22" rx="4"/><text x="14" y="51">Live   Review 12   Detections   System</text>
          <rect class="hot" x="4" y="64" width="368" height="170" rx="4"/><text x="14" y="82">waterfall: selected beam, 60 s, drag = select time</text>
          <circle cx="250" cy="215" r="5" fill="#f3c649"/><text x="262" y="218">clip marker</text>
          <g><rect class="box" x="4" y="240" width="38" height="54" rx="3"/><rect class="box" x="45" y="240" width="38" height="54" rx="3"/><rect class="box" x="86" y="240" width="38" height="54" rx="3"/><rect class="box" x="127" y="240" width="38" height="54" rx="3"/><rect class="box" x="168" y="240" width="38" height="54" rx="3"/><rect class="box" x="209" y="240" width="38" height="54" rx="3"/><rect class="box" x="250" y="240" width="38" height="54" rx="3"/><rect class="box" x="291" y="240" width="38" height="54" rx="3"/><rect class="box" x="332" y="240" width="38" height="54" rx="3"/></g>
          <text x="6" y="308">beam chips: mean, B1..B8, each with a level bar and peak</text>
          <rect class="box" x="380" y="64" width="176" height="52" rx="4"/><text x="388" y="82">inspector</text><text x="388" y="98">12.4 s, peak -41 dB</text>
          <rect class="box" x="380" y="122" width="176" height="34" rx="4"/><text x="388" y="143">[ Listen ]  not recorded</text>
          <rect class="box" x="380" y="162" width="176" height="132" rx="4"/><text x="388" y="180">ticker</text><text x="388" y="198">20:41 Alpha Wren b3 62%</text><text x="388" y="214">20:39 Pine Finch b6 71%</text><text x="388" y="230">20:36 Zed Owl b2 55%</text>
        </svg>
        <figcaption>Desktop, Live. One WebSocket feeds the waterfall, the nine meters and the ticker.</figcaption></figure></div>
      <div class="card wide"><figure>
        <svg viewBox="0 0 560 330" role="img" aria-label="Desktop Review view: a queue list on the left, a spectrogram with playhead and controls on the right, four verdict buttons.">
          <rect class="box" x="4" y="4" width="552" height="26" rx="4"/><text x="14" y="21">BMA array  [live]  strip</text>
          <rect class="box" x="4" y="36" width="552" height="22" rx="4"/><text x="14" y="51">Live   Review 12   Detections   System</text>
          <rect class="box" x="4" y="64" width="170" height="262" rx="4"/><text x="14" y="82">Queue, 12 left</text>
          <rect class="hot" x="14" y="90" width="150" height="26" rx="3"/><text x="22" y="107">Alpha Wren 62% B3</text>
          <rect class="box" x="14" y="120" width="150" height="26" rx="3"/><text x="22" y="137">Pine Finch 71% B6</text>
          <rect class="box" x="14" y="150" width="150" height="26" rx="3"/><text x="22" y="167">Zed Owl 55% B2</text>
          <rect class="box" x="182" y="64" width="374" height="262" rx="4"/><text x="192" y="82">Alpha Wren  Aus a  62%  beam 3  expires in 22 h</text>
          <rect class="hot" x="192" y="92" width="354" height="120" rx="3"/><line x1="320" y1="92" x2="320" y2="212" stroke="currentColor"/><text x="198" y="108">spectrogram, click to seek</text>
          <rect class="box" x="192" y="220" width="84" height="26" rx="4"/><text x="200" y="237">Play</text><rect class="box" x="282" y="220" width="64" height="26" rx="4"/><text x="290" y="237">Replay</text><rect class="box" x="352" y="220" width="64" height="26" rx="4"/><text x="360" y="237">0.5 1 2x</text>
          <rect class="box" x="192" y="262" width="82" height="34" rx="4"/><text x="200" y="283">Correct Y</text><rect class="box" x="280" y="262" width="82" height="34" rx="4"/><text x="288" y="283">Wrong N</text><rect class="box" x="368" y="262" width="82" height="34" rx="4"/><text x="376" y="283">Unsure U</text><rect class="box" x="456" y="262" width="90" height="34" rx="4"/><text x="464" y="283">Skip S</text>
        </svg>
        <figcaption>Desktop, Review. Keyboard: Space, R, Y, N, U, S, arrows.</figcaption></figure></div>
      <div class="card"><figure>
        <svg viewBox="0 0 220 380" role="img" aria-label="Phone Live view: sticky waterfall on top, five beam chips per row, a large Listen button, the ticker, and a bottom bar with four views.">
          <rect class="box" x="4" y="4" width="212" height="372" rx="14"/>
          <text x="14" y="24">BMA array [live] 0.22%</text>
          <rect class="hot" x="12" y="34" width="196" height="110" rx="4"/><text x="18" y="52">waterfall, pinned</text>
          <text x="14" y="164">inspector: 12.4 s, -41 dB</text>
          <g><rect class="box" x="12" y="172" width="34" height="40" rx="3"/><rect class="box" x="50" y="172" width="34" height="40" rx="3"/><rect class="box" x="88" y="172" width="34" height="40" rx="3"/><rect class="box" x="126" y="172" width="34" height="40" rx="3"/><rect class="box" x="164" y="172" width="34" height="40" rx="3"/>
             <rect class="box" x="12" y="216" width="34" height="40" rx="3"/><rect class="box" x="50" y="216" width="34" height="40" rx="3"/><rect class="box" x="88" y="216" width="34" height="40" rx="3"/><rect class="box" x="126" y="216" width="34" height="40" rx="3"/></g>
          <rect class="box" x="12" y="264" width="196" height="40" rx="6"/><text x="64" y="288">Listen</text>
          <text x="14" y="322">ticker: Alpha Wren b3 62%</text>
          <rect class="box" x="8" y="338" width="204" height="32" rx="8"/><text x="18" y="358">Live  Review  Detect  System</text>
        </svg>
        <figcaption>Phone, Live. 44 px targets, one column, bottom navigation.</figcaption></figure></div>
      <div class="card"><figure>
        <svg viewBox="0 0 220 380" role="img" aria-label="Phone Review view: player with spectrogram and two-by-two verdict buttons above the bottom bar.">
          <rect class="box" x="4" y="4" width="212" height="372" rx="14"/>
          <text x="14" y="24">Alpha Wren 62% B3</text>
          <rect class="hot" x="12" y="34" width="196" height="120" rx="4"/><line x1="100" y1="34" x2="100" y2="154" stroke="currentColor"/>
          <rect class="box" x="12" y="164" width="92" height="44" rx="6"/><text x="30" y="190">Play</text><rect class="box" x="116" y="164" width="92" height="44" rx="6"/><text x="130" y="190">Replay</text>
          <rect class="box" x="12" y="224" width="92" height="44" rx="6"/><text x="26" y="250">Correct</text><rect class="box" x="116" y="224" width="92" height="44" rx="6"/><text x="138" y="250">Wrong</text>
          <rect class="box" x="12" y="274" width="92" height="44" rx="6"/><text x="30" y="300">Unsure</text><rect class="box" x="116" y="274" width="92" height="44" rx="6"/><text x="144" y="300">Skip</text>
          <rect class="box" x="8" y="338" width="204" height="32" rx="8"/><text x="18" y="358">Live  Review  Detect  System</text>
        </svg>
        <figcaption>Phone, Review. Two-by-two verdict grid within thumb reach.</figcaption></figure></div>
    </div>
  </section>

  <section>
    <h2>Select, listen, keep, review</h2>
    <div class="card"><figure>
      <svg viewBox="0 0 900 190" role="img" aria-label="Flow: pick a beam, drag a time range; if a clip overlaps, play it in Review; otherwise the page says no audio is kept; Listen needs a consent step and shows a red indicator; Review labels write to the label store.">
        <defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
        <rect class="box" x="8" y="60" width="130" height="50" rx="6"/><text x="18" y="82">pick beam</text><text x="18" y="98">drag time range</text>
        <rect class="box" x="190" y="12" width="150" height="46" rx="6"/><text x="200" y="32">clip overlaps?</text><text x="200" y="48">yes: Play clip</text>
        <rect class="box" x="190" y="112" width="150" height="46" rx="6"/><text x="200" y="132">no overlap</text><text x="200" y="148">"no audio is kept"</text>
        <rect class="hot" x="400" y="12" width="150" height="46" rx="6"/><text x="410" y="32">Review player</text><text x="410" y="48">Y N U S, label store</text>
        <rect class="box" x="400" y="112" width="150" height="46" rx="6"/><text x="410" y="132">Listen (live)</text><text x="410" y="148">consent dialog</text>
        <rect class="box" x="610" y="112" width="130" height="46" rx="6"/><text x="620" y="132">red indicator</text><text x="620" y="148">10 min, 1 listener</text>
        <rect class="box" x="780" y="112" width="112" height="46" rx="6"/><text x="790" y="132">Stop / hidden</text><text x="790" y="148">30 s: ends</text>
        <path class="arrow" d="M138 78 L186 38" marker-end="url(#b)"/><path class="arrow" d="M138 92 L186 130" marker-end="url(#b)"/>
        <path class="arrow" d="M340 35 L396 35" marker-end="url(#b)"/><path class="arrow" d="M340 135 L396 135" marker-end="url(#b)"/>
        <path class="arrow" d="M550 135 L606 135" marker-end="url(#b)"/><path class="arrow" d="M740 135 L776 135" marker-end="url(#b)"/>
      </svg>
      <figcaption>Past time plays only as a stored clip. Live listening is a separate, explicit, time-limited session with nothing written by the server.</figcaption>
    </figure></div>
  </section>

  <!--CHOICES-->
</main>
</body>
</html>
