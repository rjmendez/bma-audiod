# CI manifest: every test file is one line in `tests` (or one line with a reason in `skips`). scripts/run_ci.py reads it;
# scripts/test_ci_workflow.py fails on a test file that is in neither list. Paths are relative to bench-kit/bma-audiod.
#   area             analysis ui pc tools contracts scripts classify control docker guards (guards run on every push, named explicitly)
#   tier             fast: deterministic, on every PR push for the changed areas. full: on master, workflow_dispatch tier=full, or label ci:full
#   os               linux windows both
#   timing_sensitive real-time paced end-to-end (host.py over UDP): starves under load, re-run once (FLAKY-PASS) in the full tier
#   needs            none torch onnx browser node powershell pwsh wsl, or py:<module> (an import probe): unavailable -> an explicit SKIP with the reason
#   timeout          seconds (default 300);  args: extra command-line arguments, {tmp} = scratch dir <RUNNER_TEMP>/<work or file stem>
# `rules` map a changed file to areas. A rule matches on prefix and/or suffix; the first matching `only` rule decides alone,
# otherwise matches are unioned; linux_only marks a reverse dependency (not applied to the windows run).
# A file no rule matches selects every area.

rules = [
  { prefix = "contracts/specs/", areas = ["contracts", "analysis", "tools", "ui"], only = true },
  { prefix = "contracts/", suffix = ".md", areas = ["contracts"], only = true },
  { prefix = "docs/FEATURES.md", areas = ["scripts", "tools"], only = true },
  { suffix = ".md", areas = [], only = true },
